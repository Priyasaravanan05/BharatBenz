# Netlify config for the bharatbenz-select-my-truck project.
# In Netlify, set Base directory = select-my-truck (no build command).
[build]
  publish = "."
  # Always deploy on push to main (Netlify was skipping deploys for this base directory)
  ignore = "exit 1"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"
