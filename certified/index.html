  }

      return;
    }
    if (node.localName === 'template' && node.hasAttribute('data-if')) {
      if (look(scope, node.getAttribute('data-if'))) renderAll(kids(node), scope, out);
      return;
    }
    var el = document.createElementNS(node.namespaceURI, node.localName), valueProp;
    for (var a = 0; a < node.attributes.length; a++) {
      var at = node.attributes[a], name = at.name, val = at.value, w = WHOLE.exec(val);
      if (name.slice(0, 2) === 'on' && w) {

        if (ev === 'change') ev = 'input';
        if (typeof fn === 'function') el.addEventListener(ev, fn);
        continue;
      }
      if (w) {
        var v = look(scope, w[1]);
        if (name === 'value') { valueProp = str(v); continue; }
        if (BOOL[name]) { if (v) el.setAttribute(name, ''); if (name === 'checked') el.checked = !!v; continue; }

<script>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { pillar: null, step: 'form', hover: null, locked: null, tab: 'All', fState: 'All states', fCity: 'All cities', fModel: 'All models', dealer: 'chennai', showC: true, showE: true, zoom: 1, cx: 50, cy: 50, popup: true, view: 'map' };

  renderVals() {
    const s = this.state;
    const accent = this.props.accent ?? '#A80C14';
    // Red headings on black use a slightly brighter red so they stay readable (as on the live page).

    const pillarCopy = {
      buy: { kicker: 'Drive Your Deal: Buy Smart.', title: 'BharatBenz Certified', intro: 'Find your perfect pre-owned BharatBenz truck. Tell us what you need and the nearest Certified touchpoint will share matching trucks.' },
      sell: { kicker: 'Drive Your Deal: Sell Fast.', title: 'Sell Your Truck', intro: 'Ready to sell your used truck? Share a few details and our team will call with a fair valuation.' },
      exchange: { kicker: 'Drive Your Deal: Exchange Easy.', title: 'BharatBenz Exchange', intro: 'Tell us about your current truck and the new BharatBenz you want — we handle the rest.' }
    };
    const P = {};
    ['buy', 'sell', 'exchange'].forEach((p) => {
      const on = s.pillar === p;
      P[p] = {
        active: on,
        label: on ? 'Selected ✓' : 'Enquire Now',
        pick: () => this.setState({ pillar: p, step: 'form' }),
        cardStyle: 'background: #FFFFFF; border: 3px solid ' + (on ? accent : '#FFFFFF') + '; padding: 28px; display: flex; flex-direction: column; gap: 14px; transition: box-shadow 0.15s',
        btnStyle: 'margin-top: auto; align-self: flex-start; height: 46px; padding: 0 22px; border-radius: 3px; font-size: 15px; font-weight: 700; text-transform: uppercase; cursor: pointer; border: 0; color: #FFFFFF; background: ' + (on ? '#000000' : accent)
      };
    });
    const pc = s.pillar ? pillarCopy[s.pillar] : pillarCopy.buy;
    const dot = (n) => {
      const idx = { form: 1, otp: 2, done: 3 }[s.step];
      const done = n < idx || s.step === 'done';

      return 'width: 28px; height: 28px; border-radius: 50%; display: inline-flex; align-items: center; justify-content: center; font-size: 13px; font-weight: 700; ' + (done ? 'background: #FFFFFF; color: #000000' : cur ? 'background: ' + accent + '; color: #FFFFFF' : 'background: #333333; color: #E0E0E0');
    };

    const F = {};
    ['warranty', 'kit', 'checklist', 'resale', 'team', 'docs'].forEach((id) => {
      const open = s.hover === id || s.locked === id;
      F[id] = {
        open,
        enter: () => this.setState({ hover: id }),
        leave: () => this.setState({ hover: null }),
        toggle: () => this.setState({ locked: s.locked === id ? null : id }),
        cardStyle: 'width: 100%; height: 100%; text-align: left; font: inherit; cursor: pointer; background: #FFFFFF; border: 1px solid ' + (open ? accent : '#DCDCDC') + '; border-bottom: 3px solid ' + (open ? accent : '#DCDCDC') + '; padding: 26px; display: flex; flex-direction: column; gap: 12px; transition: box-shadow 0.15s'
      };
    });

      { kind: 'Testimonial', title: '[Fleet owner story — video]', meta: 'Customer testimonial', len: '[2:30]' },
      { kind: 'Process', title: 'How a truck gets certified', meta: '100-point check, end to end', len: '[3:10]' },
      { kind: 'Delivery', title: '[Customer delivery — city]', meta: 'Delivery video', len: '[1:45]' },
      { kind: 'Best practice', title: '[Best-practice content title]', meta: 'From the business team', len: '[2:00]' },
      { kind: 'Testimonial', title: '[Exchange customer story]', meta: 'Customer testimonial', len: '[2:15]' },
      { kind: 'Process', title: 'Inside the refurbishment kit', meta: 'Process video', len: '[2:40]' }

    const tabs = tabNames.map((t, i) => ({
      label: t === 'All' ? 'All' : t + 's',
      active: s.tab === t,
      pick: () => this.setState({ tab: t }),
      style: 'height: 44px; padding: 0 18px; font-size: 14px; cursor: pointer; border: 0; ' + (i > 0 ? 'border-left: 1px solid #000000; ' : '') + (s.tab === t ? 'background: #FFFFFF; color: #000000; font-weight: 700' : 'background: #000000; color: #FFFFFF; font-weight: 400')
    }));
    const media = allMedia.filter((m) => s.tab === 'All' || m.kind === s.tab);

    const dealers = [
      // x / y = % position on the projected (Mercator) map of India
      { id: 'delhi', city: 'New Delhi', state: 'Delhi', type: 'both', x: 33.47, y: 30.35 },
      { id: 'jaipur', city: 'Jaipur', state: 'Rajasthan', type: 'certified', x: 29.03, y: 35.84 },
      { id: 'lucknow', city: 'Lucknow', state: 'Uttar Pradesh', type: 'certified', x: 45.16, y: 36.03 },
      { id: 'guwahati', city: 'Guwahati', state: 'Assam', type: 'certified', x: 78.87, y: 38.3 },
      { id: 'ahmedabad', city: 'Ahmedabad', state: 'Gujarat', type: 'exchange', x: 18.97, y: 48.1 },
      { id: 'indore', city: 'Indore', state: 'Madhya Pradesh', type: 'exchange', x: 29.25, y: 49.03 },
      { id: 'kolkata', city: 'Kolkata', state: 'West Bengal', type: 'both', x: 68.31, y: 49.5 },
      { id: 'nagpur', city: 'Nagpur', state: 'Maharashtra', type: 'exchange', x: 39.34, y: 53.87 },
      { id: 'mumbai', city: 'Mumbai', state: 'Maharashtra', type: 'both', x: 19.94, y: 60.17 },
      { id: 'pune', city: 'Pune', state: 'Maharashtra', type: 'certified', x: 23, y: 61.85 },
      { id: 'hyderabad', city: 'Hyderabad', state: 'Telangana', type: 'both', x: 37.47, y: 65.25 },
      { id: 'bengaluru', city: 'Bengaluru', state: 'Karnataka', type: 'both', x: 34.66, y: 78.33 },
      { id: 'chennai', city: 'Chennai', state: 'Tamil Nadu', type: 'both', x: 43.03, y: 78.01 },
      { id: 'kochi', city: 'Kochi', state: 'Kerala', type: 'exchange', x: 30.53, y: 87.2 }
    ];
    const states = Array.from(new Set(dealers.map((d) => d.state))).sort();
    const stateOpts = ['All states'].concat(states);
    const inState = dealers.filter((d) => s.fState === 'All states' || d.state === s.fState);
    const cityOpts = ['All cities'].concat(inState.map((d) => d.city).sort());
    const typeOk = (t) => (t === 'both' ? (s.showC || s.showE) : t === 'certified' ? s.showC : s.showE);
    const shown = inState.filter((d) => (s.fCity === 'All cities' || d.city === s.fCity) && typeOk(d.type));
    const typeLabel = { both: 'Certified + Exchange', certified: 'Certified', exchange: 'Exchange' };
    // ---- Map viewport: zoom / pan / labels ----
    const z = s.zoom;
    const k = 1 / z;
    const clamp = (v, lo, hi) => Math.max(lo, Math.min(hi, v));
    const tx = clamp(50 - s.cx * z, 100 - 100 * z, 0);
    const ty = clamp(50 - s.cy * z, 100 - 100 * z, 0);
    const ease = 'transition: transform 0.35s ease; ';
    const badgeFor = (t) => 'align-self: flex-start; font-size: 11px; font-weight: 700; text-transform: uppercase; padding: 4px 8px; ' + (t === 'exchange' ? 'background: #000000; color: #FFFFFF' : t === 'certified' ? 'background: ' + accent + '; color: #FFFFFF' : 'background: #FFFFFF; color: ' + accent + '; border: 1px solid ' + accent);

    const pins = shown.map((d) => {
      const sel = s.dealer === d.id;
      const fill = d.type === 'exchange' ? '#000000' : accent;
      const core = d.type === 'both' ? '#000000' : '#FFFFFF';
      const popupOpen = sel && s.popup;
      const showTag = !popupOpen && (z >= 2 || sel);
      return Object.assign({}, d, {
        typeLabel: typeLabel[d.type],
        selected: sel,
        fill, core,
        pick: () => this.setState({ dealer: d.id, popup: true, cx: d.x, cy: d.y }),
        locate: () => this.setState({ dealer: d.id, popup: true, zoom: Math.max(s.zoom, 3), cx: d.x, cy: d.y }),
        pinStyle: 'position: absolute; left: ' + d.x + '%; top: ' + d.y + '%; width: 32px; height: 44px; padding: 0; border: 0; background: transparent; cursor: pointer; display: flex; align-items: flex-end; justify-content: center; transform-origin: 0 0; ' + ease + 'transform: scale(' + (k * (sel ? 1.3 : 1)) + ') translate(-50%, -100%); z-index: ' + (sel ? 4 : 2) + '; filter: drop-shadow(0 2px 2px rgba(0,0,0,0.35))',
        tagStyle: 'position: absolute; left: 30px; top: 4px; white-space: nowrap; font-size: 12px; font-weight: 700; color: #1A1A1A; text-shadow: 0 0 3px #FFFFFF, 0 0 3px #FFFFFF, 0 0 2px #FFFFFF; pointer-events: none; display: ' + (showTag ? 'block' : 'none'),
        cardStyle: 'background: #FFFFFF; border: 1px solid #DCDCDC; border-left: 4px solid ' + (sel ? accent : '#DCDCDC') + '; padding: 16px 18px; display: flex; flex-direction: column; gap: 10px',
        badgeStyle: 'flex: none; font-size: 11px; font-weight: 700; text-transform: uppercase; padding: 4px 8px; ' + (d.type === 'exchange' ? 'background: #000000; color: #FFFFFF' : d.type === 'certified' ? 'background: ' + accent + '; color: #FFFFFF' : 'background: #FFFFFF; color: ' + accent + '; border: 1px solid ' + accent)
      });
    });
    const legend = (on) => 'display: inline-flex; align-items: center; gap: 8px; height: 40px; padding: 0 14px; border-radius: 3px; font-size: 14px; font-weight: 700; cursor: pointer; ' + (on ? 'background: #FFFFFF; color: #000000; border: 1px solid #000000' : 'background: #E6E6E6; color: #5B5B5B; border: 1px dashed #8C8C8C');

    const selPin = pins.find((p) => p.selected);
    const hasPopup = !!(selPin && s.popup);
    const popup = selPin ? { city: selPin.city, state: selPin.state, typeLabel: selPin.typeLabel, badgeStyle: badgeFor(selPin.type) } : { city: '', state: '', typeLabel: '', badgeStyle: '' };
    const popupStyle = selPin ? 'position: absolute; left: ' + selPin.x + '%; top: ' + selPin.y + '%; width: 252px; z-index: 6; transform-origin: 0 0; ' + ease + 'transform: scale(' + k + ') translate(-50%, calc(-100% - 60px))' : 'display: none';

    // Labels drawn over the base map (kept in HTML so they stay crisp in Roboto at every zoom)
    const L = [
      ['PAKISTAN', 8.75, 31.04, 'country', 1], ['AFGHANISTAN', 7.5, 13.7, 'country', 1], ['CHINA', 62.5, 15.07, 'country', 1], ['NEPAL', 54.38, 31.52, 'country', 1], ['BHUTAN', 74.84, 33.9, 'country', 1], ['BANGLADESH', 74.2, 45.05, 'country', 1], ['MYANMAR', 90.94, 52.79, 'country', 1], ['SRI LANKA', 44.38, 93.5, 'country', 1],
      ['Arabian Sea', 11.5, 70.88, 'sea', 1], ['Bay of Bengal', 64.5, 70.88, 'sea', 1], ['Laccadive Sea', 22.5, 94.5, 'sea', 1], ['Andaman Sea', 92.0, 84.5, 'sea', 1],
      ['RAJASTHAN', 22.19, 39.5, 'state', 1], ['GUJARAT', 15.0, 51.2, 'state', 1], ['MAHARASHTRA', 29.38, 57.68, 'state', 1], ['MADHYA PRADESH', 36.56, 45.4, 'state', 1], ['UTTAR PRADESH', 46.5, 31.6, 'state', 1], ['BIHAR', 60, 39.2, 'state', 1], ['ODISHA', 56.5, 54.2, 'state', 1], ['CHHATTISGARH', 48.0, 49.6, 'state', 1], ['JHARKHAND', 59.06, 46.14, 'state', 2], ['TELANGANA', 40.5, 61.0, 'state', 1], ['ANDHRA PRADESH', 41.0, 71.77, 'state', 1], ['KARNATAKA', 29.69, 72.0, 'state', 1], ['TAMIL NADU', 37.19, 83.0, 'state', 1], ['PUNJAB', 27.81, 22.99, 'state', 2], ['HIMACHAL PRADESH', 33.44, 19.3, 'state', 2], ['UTTARAKHAND', 40, 25.31, 'state', 2], ['JAMMU & KASHMIR', 24.5, 14.6, 'state', 1], ['LADAKH', 35.63, 10.25, 'state', 1], ['ASSAM', 84.0, 36.9, 'state', 1], ['ARUNACHAL PRADESH', 87.19, 31.4, 'state', 1], ['KERALA', 30.94, 84.0, 'state', 2], ['HARYANA', 30.31, 28.27, 'state', 2], ['WEST BENGAL', 66.3, 45.6, 'state', 2],
      ['Bhopal', 34.09, 47.36, 'city', 2], ['Patna', 58.25, 40.05, 'city', 2], ['Raipur', 47.28, 53.56, 'city', 2], ['Bhubaneswar', 60.38, 56.46, 'city', 2], ['Visakhapatnam', 52.25, 64.35, 'city', 2], ['Chandigarh', 32.13, 23.38, 'city', 2], ['Srinagar', 25.94, 12.05, 'city', 2], ['Madurai', 36.31, 87.2, 'city', 2], ['Coimbatore', 32.69, 84.03, 'city', 2], ['Surat', 19.78, 53.81, 'city', 2], ['Varanasi', 51.47, 40.9, 'city', 2], ['Agra', 35.97, 34.98, 'city', 2], ['Kanpur', 43.22, 37.31, 'city', 2], ['Vijayawada', 44.22, 67.88, 'city', 2], ['Thiruvananthapuram', 32.66, 91.28, 'city', 2], ['Goa', 23.28, 71.17, 'city', 2], ['Port Blair', 81.97, 82.28, 'city', 1], ['Mangaluru', 26.13, 78.51, 'city', 2], ['Rajkot', 13.44, 50.33, 'city', 2], ['Udaipur', 22.53, 43.23, 'city', 2]
    ];
    const terrain = s.view === 'terrain';
    const labelLook = {
      country: 'font-size: 12px; font-weight: 500; letter-spacing: 0.22em; color: #5E5E5E',
      sea: 'font-size: 14px; font-style: italic; letter-spacing: 0.06em; color: ' + (terrain ? '#255A82' : '#2C628C'),
      state: 'font-size: 10px; font-weight: 500; letter-spacing: 0.14em; color: ' + (terrain ? '#5F584A' : '#6B6455'),
      city: 'font-size: 12px; color: #2A2A2A; text-shadow: 0 0 3px #FFFFFF, 0 0 3px #FFFFFF'
    };
    const mapLabels = L.map(([text, x, y, kind, minZ]) => ({
      text,
      style: 'position: absolute; left: ' + x + '%; top: ' + y + '%; z-index: 1; white-space: nowrap; pointer-events: none; transform-origin: 0 0; ' + ease + 'transform: scale(' + k + ') translate(' + (kind === 'city' ? '-4px' : '-50%') + ', -50%); align-items: center; gap: 5px; ' + labelLook[kind] + '; display: ' + (z >= minZ ? 'flex' : 'none'),
      dotStyle: kind === 'city' ? 'width: 6px; height: 6px; border-radius: 50%; background: #FFFFFF; border: 1.5px solid #555555; flex: none' : 'display: none'
    }));

    const zoomBtn = (enabled) => 'width: 44px; height: 44px; border: 0; background: #FFFFFF; display: flex; align-items: center; justify-content: center; cursor: ' + (enabled ? 'pointer' : 'default') + '; color: ' + (enabled ? '#333333' : '#BDBDBD');
    const viewBtn = (on) => 'height: 44px; padding: 0 16px; border: 0; font-size: 14px; cursor: pointer; ' + (on ? 'background: #FFFFFF; color: #000000; font-weight: 700' : 'background: #F1F1F1; color: #4A4A4A; font-weight: 400');
    const KM_PER_PCT = 33.03; // km per 1% of map width at zoom 1
    const scaleKm = { 1: 500, 2: 200, 3: 100, 4: 100 }[z];
    const zoomAround = (nz) => {
      const c = selPin && s.popup ? { x: selPin.x, y: selPin.y } : { x: s.cx, y: s.cy };
      this.setState({ zoom: nz, cx: nz === 1 ? 50 : c.x, cy: nz === 1 ? 50 : c.y });
    };

    // Latest 8 listings from bharatbenz.com/buy-second-hand-trucks/buy/All-All (model, state, reference no., year, km, warranty)
    const latest = [
      ['914R','Gujarat','BB006779R',2015,346782,'No'],
      ['2523R','Maharashtra','BB0067625R',2013,702030,'No'],
      ['3123R','Maharashtra','BB0067531R',2013,671000,'No'],
      ['2523C','Maharashtra','BB0067425C',2014,612000,'No'],
      ['3123R','Maharashtra','BB0067331R',2013,424900,'No'],
      ['2523C','Maharashtra','BB0067225C',2013,400000,'No'],
      ['3123R','Maharashtra','BB0067131R',2013,896200,'No'],
      ['2523R','Maharashtra','BB0067025R',2013,638900,'No']
    ];
    const listing = latest.map(([model, state, ref, year, km, warranty]) => ({
      model, state, ref, year, warranty,
      kms: km.toLocaleString('en-IN') + ' km',
      url: 'https://www.bharatbenz.com/used-vehicles/BharatBenz--resale-' + ref
    }));
    const modelOpts = ['All models'];

    return {
      accent, heading,
      P,
      showForm: !!s.pillar,
      formKicker: pc.kicker, formTitle: pc.title, formIntro: pc.intro,
      isFormStep: s.step === 'form', isOtpStep: s.step === 'otp', isDoneStep: s.step === 'done',
      stepDot1: dot(1), stepDot2: dot(2), stepDot3: dot(3),
      sendOtp: () => this.setState({ step: 'otp' }),
      verifyOtp: () => this.setState({ step: 'done' }),
      backToForm: () => this.setState({ step: 'form' }),
      closeForm: () => this.setState({ pillar: null, step: 'form' }),
      pickBuy: () => this.setState({ pillar: 'buy', step: 'form' }),
      F,
      tabs, media,
      stateOpts, cityOpts, modelOpts,
      fState: s.fState, fCity: s.fCity, fModel: s.fModel,
      onState: (e) => this.setState({ fState: e.target.value, fCity: 'All cities' }),
      onCity: (e) => this.setState({ fCity: e.target.value }),
      onModel: (e) => this.setState({ fModel: e.target.value }),
      showC: s.showC, showE: s.showE,
      toggleC: () => this.setState({ showC: !s.showC }),
      toggleE: () => this.setState({ showE: !s.showE }),
      legendC: legend(s.showC), legendE: legend(s.showE),
      pins,
      worldStyle: 'position: absolute; inset: 0; transform-origin: 0 0; ' + ease + 'transform: translate(' + tx + '%, ' + ty + '%) scale(' + z + ')',
      isMapView: !terrain, isTerrainView: terrain,
      setMapView: () => this.setState({ view: 'map' }),
      setTerrainView: () => this.setState({ view: 'terrain' }),
      viewBtnMap: viewBtn(!terrain), viewBtnTerrain: viewBtn(terrain),
      mapLabels,
      hasPopup, popup, popupStyle,
      closePopup: () => this.setState({ popup: false }),
      zoomIn: () => { if (z < 4) zoomAround(z + 1); },
      zoomOut: () => { if (z > 1) zoomAround(z - 1); },
      zoomInStyle: zoomBtn(z < 4), zoomOutStyle: zoomBtn(z > 1),
      recenter: () => this.setState({ zoom: 1, cx: 50, cy: 50 }),
      zoomLabel: z + '×',
      scaleLabel: scaleKm + ' km',
      scaleBoxW: 'calc(' + (scaleKm / KM_PER_PCT * z) + '% + 16px)',
      noDealers: pins.length === 0,
      dealerCountLabel: pins.length + (pins.length === 1 ? ' touchpoint' : ' touchpoints') + (s.fState === 'All states' ? ' across India' : ' in ' + s.fState),
      listing,
      listingCount: listing.length,
      noListing: listing.length === 0,
      listingLabel: 'Latest ' + listing.length + ' trucks'
    };
  }
}
mountDC(Component, {"accent": "#A80C14"});
</script>
