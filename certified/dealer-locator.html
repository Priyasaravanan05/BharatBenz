      });

      ['Bhopal', 34.09, 47.36, 'city', 2], ['Patna', 58.25, 40.05, 'city', 2], ['Raipur', 47.28, 53.56, 'city', 2], ['Bhubaneswar', 60.38, 56.46, 'city', 2], ['Visakhapatnam', 52.25, 64.35, 'city', 2], ['Chandigarh', 32.13, 23.38, 'city', 2], ['Srinagar', 25.94, 12.05, 'city', 2], ['Madurai', 36.31, 87.2, 'city', 2], ['Coimbatore', 32.69, 84.03, 'city', 2], ['Surat', 19.78, 53.81, 'city', 2], ['Varanasi', 51.47, 40.9, 'city', 2], ['Agra', 35.97, 34.98, 'city', 2], ['Kanpur', 43.22, 37.31, 'city', 2], ['Vijayawada', 44.22, 67.88, 'city', 2], ['Thiruvananthapuram', 32.66, 91.28, 'city', 2], ['Goa', 23.28, 71.17, 'city', 2], ['Port Blair', 81.97, 82.28, 'city', 1], ['Mangaluru', 26.13, 78.51, 'city', 2], ['Rajkot', 13.44, 50.33, 'city', 2], ['Udaipur', 22.53, 43.23, 'city', 2]
