<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Parivartan Scheme — BharatBenz</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700;900&amp;family=Noto+Sans+Devanagari:wght@400;500;700&amp;display=swap">
<style>
body{margin:0;background:#FFFFFF}
a{color:#D71920}a:hover{color:#1A1A1A}
input,select,button{font-family:inherit}
summary{cursor:pointer;list-style:none}
summary::-webkit-details-marker{display:none}
</style>
</head>
<body>
<div id="app"></div>
<template id="dc">
<div style="font-family: 'Roboto', 'Noto Sans Devanagari', system-ui, sans-serif; color: #1A1A1A; background: #FFFFFF; font-size: 16px; line-height: 1.55; position: relative">

<!-- Utility bar -->
<div style="background: #000000; color: #C9CCCF; font-size: 13px">
<div style="max-width: 1240px; margin: 0 auto; padding: 8px 24px; display: flex; flex-wrap: wrap; justify-content: flex-end; align-items: center; gap: 20px">
<a href="#" style="color: #C9CCCF; text-decoration: none">Newsroom</a>
<a href="#" style="color: #C9CCCF; text-decoration: none">Image Gallery</a>
<a href="#" style="color: #C9CCCF; text-decoration: none">Blog</a>
<a href="#" style="color: #C9CCCF; text-decoration: none">About us</a>
<a href="#" style="color: #C9CCCF; text-decoration: none">Construction &amp; Mining Range Launch</a>
<a href="#" style="color: #C9CCCF; text-decoration: none">Contact us</a>
<div role="group" aria-label="Language" style="display: flex; border: 1px solid #4A4D50; border-radius: 4px; overflow: hidden">
<button type="button" onClick="{{setHi}}" aria-pressed="{{isHi}}" style="{{hiStyle}}">हिंदी</button>
<button type="button" onClick="{{setEn}}" aria-pressed="{{isEn}}" style="{{enStyle}}">EN</button>
</div>
</div>
</div>

<!-- Header -->
<header style="background: #FFFFFF; border-bottom: 1px solid #DDDDDD">
<div style="max-width: 1240px; margin: 0 auto; padding: 12px 24px; display: flex; flex-wrap: wrap; align-items: center; gap: 24px">
<a href="#" aria-label="BharatBenz home" style="display: flex; align-items: center; gap: 12px; text-decoration: none">
<img src="assets/bharatbenz-logo.png" alt="BharatBenz" style="display: block; height: 60px; width: auto">
</a>
<nav aria-label="Main" onMouseLeave="{{closeMenu}}" style="display: flex; flex-wrap: wrap; align-items: center; gap: 8px 26px; flex: 1 1 480px; justify-content: flex-end; font-size: 15px; font-weight: 600">
<template data-for="navItems" data-as="n">
<div style="position: relative">
<button type="button" onMouseEnter="{{n.open}}" onClick="{{n.toggle}}" aria-expanded="{{n.isOpen}}" style="{{n.style}}">{{n.label}}<template data-if="n.hasSub"><svg aria-hidden="true" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"></path></svg></template></button>
<template data-if="n.showMenu">
<div style="position: absolute; top: 100%; left: -12px; z-index: 30; min-width: 250px; background: #FFFFFF; border-top: 3px solid #D71920; border-radius: 0 0 6px 6px; box-shadow: 0 12px 28px rgba(0,0,0,0.18); padding: 8px 0; display: flex; flex-direction: column">
<template data-for="n.items" data-as="i">
<a href="#" style="display: block; padding: 10px 18px; color: #1A1A1A; text-decoration: none; font-weight: 500">{{i.label}}</a>
</template>
</div>
</template>
</div>
</template>
</nav>
<a href="#enquire" style="background: {{accent}}; color: #FFFFFF; text-decoration: none; font-weight: 600; padding: 12px 22px; border-radius: 4px; min-height: 44px; box-sizing: border-box; display: inline-flex; align-items: center">Enquire Now</a>
</div>
</header>

<!-- Hero banner -->
<section aria-label="Parivartan banner" style="background: #FFFFFF">
<img src="assets/parivartan-banner.jpg" alt="Parivartan with BharatBenz: Upgrade to BS-VI trucks and buses now. Check your eligibility for scrappage or exchange benefits today." style="display: block; width: 100%; height: auto; aspect-ratio: 2419 / 1209; object-fit: cover">
<div style="max-width: 1240px; margin: 0 auto; padding: 14px 24px; font-size: 14px; color: #5E5E5E">
<a href="#" style="color: #5E5E5E; text-decoration: none">Home</a> › <span style="color: #1A1A1A; font-weight: 600">Parivartan Scheme</span>
</div>
</section>

<!-- What is Parivartan -->
<section id="overview" style="background: #FFFFFF">
<div style="max-width: 1240px; margin: 0 auto; padding: 40px 24px 64px; display: flex; flex-wrap: wrap; gap: 48px; align-items: center">
<div style="flex: 3 1 480px; min-width: 0; display: flex; flex-direction: column; gap: 16px">
<p style="margin: 0; font-size: 14px; font-weight: 700; letter-spacing: 0.14em; text-transform: uppercase; color: #D71920">Government of India initiative · परिवर्तन</p>
<h1 style="margin: 0; font-family: 'Roboto', sans-serif; font-size: 52px; line-height: 1.02; font-weight: 700; text-transform: uppercase; color: #1A1A1A">What is the Parivartan Scheme?</h1>
<p style="margin: 0; font-size: 18px; color: #4A4A4A">Parivartan helps owners of older commercial vehicles replace them with cleaner, more efficient BS-VI trucks and buses. Owners of eligible vehicles in the Delhi NCR region can avail tax concessions, registration fee waiver, interest subsidy and additional OEM benefits from BharatBenz.</p>
<div style="display: flex; flex-wrap: wrap; gap: 12px; margin-top: 8px">
<a href="#eligibility" style="background: {{accent}}; color: #FFFFFF; text-decoration: none; font-weight: 600; padding: 14px 26px; border-radius: 4px; min-height: 48px; box-sizing: border-box; display: inline-flex; align-items: center">Check your eligibility</a>
<a href="find-a-dealer.html" style="border: 2px solid #D71920; color: #D71920; text-decoration: none; font-weight: 600; padding: 12px 24px; border-radius: 4px; min-height: 48px; box-sizing: border-box; display: inline-flex; align-items: center">Locate a dealer</a>
</div>
</div>
<div style="flex: 2 1 320px; min-width: 0; background: #1A1A1A; color: #FFFFFF; border-radius: 8px; padding: 32px; display: flex; flex-direction: column; gap: 18px">
<p style="margin: 0; font-family: 'Roboto', sans-serif; font-size: 26px; font-weight: 700; text-transform: uppercase">At a glance</p>
<div style="display: flex; gap: 14px; align-items: flex-start"><span style="width: 10px; height: 10px; margin-top: 8px; border-radius: 50%; background: #D71920; flex: none"></span><div><p style="margin: 0; font-weight: 600">Region</p><p style="margin: 0; color: #CCCCCC">Delhi NCR registered vehicles</p></div></div>
<div style="display: flex; gap: 14px; align-items: flex-start"><span style="width: 10px; height: 10px; margin-top: 8px; border-radius: 50%; background: #D71920; flex: none"></span><div><p style="margin: 0; font-weight: 600">Old vehicle</p><p style="margin: 0; color: #CCCCCC">BS-IV or older truck or bus</p></div></div>
<div style="display: flex; gap: 14px; align-items: flex-start"><span style="width: 10px; height: 10px; margin-top: 8px; border-radius: 50%; background: #D71920; flex: none"></span><div><p style="margin: 0; font-weight: 600">New vehicle</p><p style="margin: 0; color: #CCCCCC">BS-VI BharatBenz, same or lower category</p></div></div>
<div style="display: flex; gap: 14px; align-items: flex-start"><span style="width: 10px; height: 10px; margin-top: 8px; border-radius: 50%; background: #D71920; flex: none"></span><div><p style="margin: 0; font-weight: 600">Scheme validity</p><p style="margin: 0; color: #CCCCCC">[Start date – End date]</p></div></div>
</div>
</div>
</section>

<!-- Benefits -->
<section id="benefits" style="background: #F4F4F4">
<div style="max-width: 1240px; margin: 0 auto; padding: 64px 24px">
<h2 style="margin: 0 0 8px; font-family: 'Roboto', sans-serif; font-size: 40px; line-height: 1.05; font-weight: 700; text-transform: uppercase; color: #1A1A1A">Avail benefits like</h2>
<p style="margin: 0 0 32px; color: #4A4A4A; max-width: 640px">Lorem ipsum dolor sit amet, consectetur adipiscing elit.</p>
<div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 16px">
<template data-for="benefits" data-as="b">
<div style="background: #FFFFFF; border-radius: 8px; padding: 24px; display: flex; gap: 18px; align-items: flex-start; border-bottom: 4px solid #D71920">
<div style="width: 56px; height: 56px; border-radius: 50%; background: #D71920; color: #FFFFFF; display: flex; align-items: center; justify-content: center; flex: none">
<svg aria-hidden="true" width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="{{b.icon}}"></path></svg>
</div>
<div>
<p style="margin: 0; font-family: 'Roboto', sans-serif; font-size: 26px; line-height: 1.1; font-weight: 700; color: #1A1A1A">{{b.title}}</p>
<p style="margin: 4px 0 0; color: #4A4A4A">{{b.text}}</p>
</div>
</div>
</template>
</div>
</div>
</section>

<!-- Eligibility -->
<section id="eligibility" style="background: #FFFFFF">
<div style="max-width: 1240px; margin: 0 auto; padding: 64px 24px">
<div style="display: flex; flex-wrap: wrap; gap: 48px">
<div style="flex: 1 1 340px; min-width: 0; display: flex; flex-direction: column; gap: 16px">
<h2 style="margin: 0; font-family: 'Roboto', sans-serif; font-size: 40px; line-height: 1.05; font-weight: 700; text-transform: uppercase; color: #1A1A1A">Who is eligible?</h2>
<p style="margin: 0; color: #4A4A4A">Owners of BS-IV or older commercial vehicles in Delhi NCR, subject to scheme conditions.</p>
<ul style="list-style: none; margin: 8px 0 0; padding: 0; display: flex; flex-direction: column; gap: 12px">
<li style="display: flex; gap: 12px; align-items: flex-start"><svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#D71920" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" style="flex: none; margin-top: 2px"><path d="M5 12l5 5 9-10"></path></svg><span>Your current vehicle is BS-IV or older</span></li>
<li style="display: flex; gap: 12px; align-items: flex-start"><svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#D71920" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" style="flex: none; margin-top: 2px"><path d="M5 12l5 5 9-10"></path></svg><span>It is registered in Delhi NCR</span></li>
<li style="display: flex; gap: 12px; align-items: flex-start"><svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#D71920" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" style="flex: none; margin-top: 2px"><path d="M5 12l5 5 9-10"></path></svg><span>The replacement is in the same or a lower vehicle category</span></li>
</ul>
</div>
<div style="flex: 2 1 560px; min-width: 0">
<p style="margin: 0 0 12px; font-weight: 700; color: #1A1A1A">Replace with a BharatBenz</p>
<div role="tablist" aria-label="Vehicle category" style="display: flex; gap: 4px; border-bottom: 1px solid #DDDDDD; margin-bottom: 20px">
<template data-for="catTabs" data-as="c">
<button type="button" role="tab" aria-selected="{{c.isSel}}" onClick="{{c.pick}}" style="{{c.style}}">{{c.label}}</button>
</template>
</div>
<div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 12px">
<template data-for="ranges" data-as="r">
<a href="#" style="border: 1px solid #DDDDDD; border-radius: 8px; padding: 20px; text-decoration: none; color: #1A1A1A; display: flex; flex-direction: column; gap: 4px; min-height: 120px; box-sizing: border-box">
<span style="font-family: 'Roboto', sans-serif; font-size: 24px; font-weight: 700; color: #1A1A1A">{{r.name}}</span>
<span style="color: #4A4A4A">{{r.spec}}</span>
<span style="margin-top: auto; font-weight: 600; color: #D71920">Explore range ›</span>
</a>
</template>
</div>
</div>
</div>
</div>
</section>

<!-- VIN checker -->
<section id="check" style="background: #1A1A1A; color: #FFFFFF">
<div style="max-width: 1240px; margin: 0 auto; padding: 56px 24px; display: flex; flex-wrap: wrap; gap: 40px; align-items: flex-start">
<div style="flex: 1 1 320px; min-width: 0; display: flex; flex-direction: column; gap: 12px">
<h2 style="margin: 0; font-family: 'Roboto', sans-serif; font-size: 40px; line-height: 1.05; font-weight: 700; text-transform: uppercase">Check your eligibility</h2>
<p style="margin: 0; color: #CCCCCC">Enter the 17-character VIN of your current vehicle. You'll find it on the registration certificate (RC) and the chassis plate.</p>
<p style="margin: 0; font-size: 14px; color: #CCCCCC">You can also verify on the official <a href="https://parivahan.parivahan.gov.in/parivartan" style="color: #FFFFFF">Parivahan Parivartan portal</a>.</p>
</div>
<form onSubmit="{{onCheck}}" style="flex: 1 1 520px; min-width: 0; display: flex; flex-direction: column; gap: 12px">
<label for="vin" style="font-weight: 600; font-size: 15px">Vehicle Identification Number (VIN)</label>
<div style="display: flex; flex-wrap: wrap; gap: 12px">
<input id="vin" name="vin" type="text" maxlength="17" autocomplete="off" placeholder="e.g. MEC0123ABCD456789" value="{{vin}}" onChange="{{onVin}}" aria-describedby="vin-help" style="flex: 1 1 280px; min-width: 0; height: 54px; box-sizing: border-box; padding: 0 16px; font-size: 18px; letter-spacing: 0.08em; text-transform: uppercase; border: 0; border-radius: 4px; background: #FFFFFF; color: #1A1A1A">
<button type="submit" style="height: 54px; padding: 0 30px; border: 0; border-radius: 4px; background: {{accent}}; color: #FFFFFF; font-size: 16px; font-weight: 700; letter-spacing: 0.04em; text-transform: uppercase; cursor: pointer">Check eligibility</button>
</div>
<p id="vin-help" style="margin: 0; font-size: 14px; color: #CCCCCC">{{vinCount}} / 17 characters</p>
<template data-if="vinError">
<p role="alert" style="margin: 0; color: #FFC9C4; font-weight: 500">Enter a valid 17-character VIN. The letters I, O and Q are not used in a VIN.</p>
</template>
<template data-if="showEligible">
<div role="status" style="background: #FFFFFF; color: #1A1A1A; border-left: 0; border-radius: 6px; padding: 18px 20px; display: flex; gap: 14px; align-items: flex-start">
<svg aria-hidden="true" width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#1E7B3A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="flex: none; margin-top: 2px"><circle cx="12" cy="12" r="10"></circle><path d="M8 12l3 3 5-6"></path></svg>
<div>
<p style="margin: 0; font-weight: 700; font-size: 18px; color: #1E7B3A">You are eligible under the scheme.</p>
<p style="margin: 4px 0 0; color: #4A4A4A">Contact <a href="mailto:noreply_mktg@bharatbenz.com">noreply_mktg@bharatbenz.com</a> for more information.</p>
</div>
</div>
</template>
<template data-if="showNotEligible">
<div role="status" style="background: #FFFFFF; color: #1A1A1A; border-radius: 6px; padding: 18px 20px; display: flex; gap: 14px; align-items: flex-start">
<svg aria-hidden="true" width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#B3261E" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="flex: none; margin-top: 2px"><circle cx="12" cy="12" r="10"></circle><path d="M15 9l-6 6M9 9l6 6"></path></svg>
<div>
<p style="margin: 0; font-weight: 700; font-size: 18px; color: #B3261E">You are not eligible under the scheme.</p>
<p style="margin: 4px 0 0; color: #4A4A4A">Contact <a href="mailto:noreply_mktg@bharatbenz.com">noreply_mktg@bharatbenz.com</a> for more information.</p>
</div>
</div>
</template>
</form>
</div>
</section>

<!-- Dealer locator CTA -->
<section id="dealers" style="background: #FFFFFF">
<div style="max-width: 1240px; margin: 0 auto; padding: 56px 24px">
<div style="background: #F4F4F4; border-left: 0; border-radius: 8px; padding: 36px 40px; display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 24px">
<div style="display: flex; gap: 20px; align-items: center; flex: 1 1 520px; min-width: 0">
<div style="width: 64px; height: 64px; border-radius: 50%; background: #D71920; color: #FFFFFF; display: flex; align-items: center; justify-content: center; flex: none"><svg aria-hidden="true" width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 21s-7-6.2-7-11.5A7 7 0 0 1 19 9.5C19 14.8 12 21 12 21z"></path><circle cx="12" cy="9.5" r="2.5"></circle></svg></div>
<div style="display: flex; flex-direction: column; gap: 6px">
<h2 style="margin: 0; font-family: 'Roboto', sans-serif; font-size: 32px; line-height: 1.1; font-weight: 700; text-transform: uppercase; color: #1A1A1A">Find a Parivartan partner dealer</h2>
<p style="margin: 0; color: #4A4A4A">Locate a participating BharatBenz dealership near you to start your vehicle upgrade.</p>
</div>
</div>
<a href="find-a-dealer.html" style="background: {{accent}}; color: #FFFFFF; text-decoration: none; font-weight: 700; padding: 0 30px; border-radius: 4px; min-height: 54px; box-sizing: border-box; display: inline-flex; align-items: center; gap: 10px; font-size: 16px; text-transform: uppercase; letter-spacing: 0.04em">Go to Dealer Locator<svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"></path></svg></a>
</div>
</div>
</section>

<!-- Scheme details -->
<section id="details" style="background: #F4F4F4">
<div style="max-width: 1240px; margin: 0 auto; padding: 64px 24px">
<h2 style="margin: 0 0 20px; font-family: 'Roboto', sans-serif; font-size: 40px; line-height: 1.05; font-weight: 700; text-transform: uppercase; color: #1A1A1A">Scheme details</h2>
<div role="tablist" aria-label="Scheme details" style="display: flex; flex-wrap: wrap; gap: 4px; border-bottom: 1px solid #CFCFCF">
<template data-for="tabs" data-as="tb">
<button type="button" role="tab" aria-selected="{{tb.isSel}}" onClick="{{tb.pick}}" style="{{tb.style}}">{{tb.label}}</button>
</template>
</div>
<div role="tabpanel" style="padding: 28px 0 0">
<template data-if="tabFin">
<div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 16px">
<div style="background: #FFFFFF; border-radius: 8px; padding: 24px; display: flex; flex-direction: column; gap: 8px"><p style="margin: 0; font-family: 'Roboto', sans-serif; font-size: 24px; font-weight: 700; color: #1A1A1A">5% interest subsidy</p><p style="margin: 0; color: #4A4A4A">Up to 5 years on eligible vehicle loans. [Partner banks / NBFCs]</p></div>
<div style="background: #FFFFFF; border-radius: 8px; padding: 24px; display: flex; flex-direction: column; gap: 8px"><p style="margin: 0; font-family: 'Roboto', sans-serif; font-size: 24px; font-weight: 700; color: #1A1A1A">[Financing partner 1]</p><p style="margin: 0; color: #4A4A4A">[Rate, tenure, down payment, documents]</p></div>
<div style="background: #FFFFFF; border-radius: 8px; padding: 24px; display: flex; flex-direction: column; gap: 8px"><p style="margin: 0; font-family: 'Roboto', sans-serif; font-size: 24px; font-weight: 700; color: #1A1A1A">[Financing partner 2]</p><p style="margin: 0; color: #4A4A4A">[Rate, tenure, down payment, documents]</p></div>
</div>
</template>
<template data-if="tabOther">
<div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 24px 40px">
<div><p style="margin: 0 0 4px; font-weight: 700; color: #1A1A1A">Scrappage / disposal</p><p style="margin: 0; color: #4A4A4A">[Registered vehicle scrapping facility process and certificate]</p></div>
<div><p style="margin: 0 0 4px; font-weight: 700; color: #1A1A1A">Documents required</p><p style="margin: 0; color: #4A4A4A">[RC, ID proof, scrappage certificate, etc.]</p></div>
<div><p style="margin: 0 0 4px; font-weight: 700; color: #1A1A1A">Validity</p><p style="margin: 0; color: #4A4A4A">[Scheme start and end dates]</p></div>
<div><p style="margin: 0 0 4px; font-weight: 700; color: #1A1A1A">Terms &amp; conditions</p><p style="margin: 0"><a href="#">[Link to full T&amp;C]</a></p></div>
</div>
</template>
<template data-if="tabNews">
<ul style="list-style: none; margin: 0; padding: 0">
<li style="display: flex; flex-wrap: wrap; gap: 8px 24px; padding: 18px 0; border-bottom: 1px solid #CFCFCF"><span style="font-weight: 700; color: #D71920; min-width: 120px">[DD Mon YYYY]</span><span>[New information / announcement about the scheme]</span></li>
<li style="display: flex; flex-wrap: wrap; gap: 8px 24px; padding: 18px 0; border-bottom: 1px solid #CFCFCF"><span style="font-weight: 700; color: #D71920; min-width: 120px">[DD Mon YYYY]</span><span>[New dealer / state added]</span></li>
</ul>
</template>
</div>
</div>
</section>

<!-- How to avail -->
<section style="background: #FFFFFF">
<div style="max-width: 1240px; margin: 0 auto; padding: 64px 24px">
<h2 style="margin: 0 0 28px; font-family: 'Roboto', sans-serif; font-size: 40px; line-height: 1.05; font-weight: 700; text-transform: uppercase; color: #1A1A1A">How to avail Parivartan benefits</h2>
<ol style="list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 16px">

      { q: 'Can I replace my old truck?', a: '[Answer]' },
      { q: 'Can I replace my old bus?', a: '[Answer]' },
      { q: 'What benefits are available?', a: '5% interest subsidy up to 5 years, 100% motor vehicle tax exemption, registration fee exemption, additional fuel incentives and OEM benefits of at least 8%.' },
      { q: 'How do I check my eligibility?', a: 'Enter your VIN in the eligibility checker on this page, or verify on the official Parivahan Parivartan portal.' },

    const NAV = [

    const seg = (on) => `min-height: 44px; padding: 0 18px; border: 0; border-radius: 4px; cursor: pointer; font-size: 15px; font-weight: 700; background: ${on ? '#D71920' : 'transparent'}; color: ${on ? '#FFFFFF' : '#1A1A1A'}`;
    const pill = (on) => `min-height: 28px; padding: 2px 12px; border: 0; cursor: pointer; font-size: 13px; font-weight: 600; background: ${on ? '#FFFFFF' : 'transparent'}; color: ${on ? '#111111' : '#C9CCCF'}`;
    const res = s.result;
    return {

      vin: s.vin, vinCount: s.vin.length, vinError: s.vinError,
      showEligible: res === 'eligible', showNotEligible: res === 'not eligible',
      onVin: (e) => this.setState({ vin: e.target.value.toUpperCase().replace(/\s/g, '').slice(0, 17), vinError: false, result: null }),
      onCheck: (e) => {
        e.preventDefault();
        const ok = /^[A-HJ-NPR-Z0-9]{17}$/.test(s.vin);
        this.setState(ok ? { vinError: false, result: this.props.vinResult ?? 'eligible' } : { vinError: true, result: null });
      },
      tiles,
      clearHover: () => this.setState({ hover: null }),
      focusName: nameOf(focus),
      dealers, dealer: dealer || { name: '', city: '', spoc: '', mobile: '', tel: '#' },
      hasDealer: !!dealer, noDealer: !dealer,
      closeDealer: () => this.setState({ dealer: null }),
      tabs, tabFin: s.tab === 'fin', tabOther: s.tab === 'other', tabNews: s.tab === 'news',
      activeStates: Object.keys(D).map((c) => ({ name: nameOf(c) })),
      otpLabel: s.otp ? 'Resend OTP' : 'Send OTP',
      sendOtp: () => this.setState({ otp: true }),
      notSubmitted: !s.submitted, submitted: s.submitted,
      onEnquire: (e) => { e.preventDefault(); this.setState({ submitted: true }); },
      resetEnquiry: () => this.setState({ submitted: false }),
      navItems, closeMenu: () => this.setState({ menu: null }),
      dirDealers, dCount: dirDealers.length, dNone: dirDealers.length === 0,
      dEligibleOnly: s.dEligible, dAllOn: !s.dEligible,
      dElStyle: seg(s.dEligible), dAllStyle: seg(!s.dEligible),
      dShowEligible: () => this.setState({ dEligible: true }),
      dShowAll: () => this.setState({ dEligible: false }),
      dState: s.dState, dType: s.dType,
      dStates: [...new Set(DIR.map((d) => d.state))].sort().map((name) => ({ name })),
      onDState: (e) => this.setState({ dState: e.target.value }),
      onDType: (e) => this.setState({ dType: e.target.value })
    };
  }
}
