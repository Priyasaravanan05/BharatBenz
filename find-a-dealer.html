<script>
(function () {
  var HOLE = /\{\{\s*([^}]+?)\s*\}\}/g, WHOLE = /^\s*\{\{\s*([^}]+?)\s*\}\}\s*$/;
  var BOOL = { disabled: 1, checked: 1, selected: 1, required: 1, hidden: 1, open: 1 };
  function look(scope, path) {
    if (path === 'true') return true; if (path === 'false') return false;
    if (/^-?\d+(\.\d+)?$/.test(path)) return Number(path);
    var parts = path.split('.'), v = scope[parts[0]];
    for (var i = 1; i < parts.length && v != null; i++) v = v[parts[i]];
    return v;
  }
  function str(v) { return v == null ? '' : String(v); }
  function fill(text, scope) { return text.replace(HOLE, function (_, p) { return str(look(scope, p)); }); }
  function kids(node) { return node.content ? node.content.childNodes : node.childNodes; }
  function renderAll(nodes, scope, out) { for (var i = 0; i < nodes.length; i++) render(nodes[i], scope, out); }
  function render(node, scope, out) {
    if (node.nodeType === 3) { out.appendChild(document.createTextNode(fill(node.data, scope))); return; }
    if (node.nodeType !== 1) return;

      for (var i = 0; i < list.length; i++) { var sc = Object.create(scope); sc[as] = list[i]; sc.$index = i; renderAll(kids(node), sc, out); }
      return;
    }
    if (node.localName === 'template' && node.hasAttribute('data-if')) {
      if (look(scope, node.getAttribute('data-if'))) renderAll(kids(node), scope, out);
      return;
    }
    var el = document.createElementNS(node.namespaceURI, node.localName), valueProp;
    for (var a = 0; a < node.attributes.length; a++) {
      var at = node.attributes[a], name = at.name, val = at.value, w = WHOLE.exec(val);
      if (name.slice(0, 2) === 'on' && w) {
        var fn = look(scope, w[1]), ev = name.slice(2);
        if (ev === 'change') ev = 'input';
        if (typeof fn === 'function') el.addEventListener(ev, fn);
        continue;
      }
      if (w) {
        var v = look(scope, w[1]);
        if (name === 'value') { valueProp = str(v); continue; }
        if (BOOL[name]) { if (v) el.setAttribute(name, ''); if (name === 'checked') el.checked = !!v; continue; }
        if (v === false || v == null) { if (name.slice(0, 5) === 'aria-') el.setAttribute(name, 'false'); continue; }
        el.setAttribute(name, str(v));
        continue;
      }

      try { s0 = act.selectionStart; s1 = act.selectionEnd; } catch (e) {}

    };

    const accent = this.props.accent ?? '#99231E';
    const s = this.state;
    const NAV = [
      ['Trucks', ['MDT (10-19 tonnes)', 'HDT (R) (28-48 tonnes)', 'HDT (RT) (28-48 tonnes)', 'HDT (C) (19-35 tonnes)', 'HDT (T) (40-55 tonnes)']],
      ['Buses', ['School Bus', 'Staff Bus', 'Medium Duty Bus Chassis', 'Heavy Duty Bus Chassis']],
      ['Parts and Services', ['Rakshana', 'Truckonnect', 'Genuine Parts', 'Share your Feedback']],
      ['Pre-Owned Trucks', []],
      ['Dealership', ['Find a Dealer', 'Become a Dealer']],
      ['Customers', ['Testimonials', 'Kilometer Millionaire', 'Important Information for Customers']]
    ];
    const navItems = NAV.map(([label, subs]) => {
      const isOpen = s.menu === label && subs.length > 0;
      const current = label === 'Dealership';
      return {
        label, hasSub: subs.length > 0, isOpen, showMenu: isOpen,
        items: subs.map((x) => ({ label: x })),
        style: `display: inline-flex; align-items: center; gap: 4px; min-height: 44px; padding: 0; border: 0; background: transparent; font-size: 15px; font-weight: 600; cursor: pointer; color: ${isOpen || current ? '#D71920' : '#1A1A1A'}; box-shadow: ${current ? 'inset 0 -2px 0 #D71920' : 'none'}`,
        open: () => this.setState({ menu: label }),
        toggle: () => this.setState({ menu: s.menu === label ? null : label })
      };
    });
    // Real dealers from bharatbenz.com/find-a-dealer. `eligible` is SAMPLE data (dealer in an NCR district) until the official partner list is in.
    const DIR = [
      ['Autobahn Trucking - Agra', 'Property No 162/1, NH-19, Nagla Rambaksh, Bhagupur, Kuberpur, Etmadpur, Agra, Uttar Pradesh, 283202', false, 27.18, 78.01],
      ['Autobahn Trucking - Bareilly', 'Shop No B - 11, Transport Nagar, Transport Nagar Road, Mohenpur, Bareilly, Uttar Pradesh, 243123', false, 28.37, 79.43],
      ['Autobahn Trucking - Faridabad', 'Ground Floor & First Floor, Plot No.80, Sector - 58, Transport Nagar, Ballabgarh, Faridabad, Haryana, 121004', true, 28.41, 77.31],
      ['Autobahn Trucking - Ghaziabad', 'Plot No 1283, 1285, 1284, Morta, Delhi-Meerut Road, Metro Pillar No 700, Ghaziabad, Uttar Pradesh, 201003', true, 28.70, 77.45],
      ['Autobahn Trucking - Moradabad', 'Khasra No 93A, 93B, Rampur Road, Dilari, Moradabad, Uttar Pradesh, 244401', false, 28.84, 78.77],
      ['Autobahn Trucking - Muzaffarnagar', 'Khasra No 295, Near Toll Plaza, Chhapar, Muzaffarnagar, Uttar Pradesh, 251307', true, 29.47, 77.70],
      ['Autobahn Trucking - Noida', 'Workspace by Innova, H-57, Sector-63, Noida, near Noida Electronic City metro station', true, 28.62, 77.38],
      ['Autobahn Trucking - Palwal', 'Khatoni No 185/187 and 186/188, Village Bahraula, Bahraula flyover, Palwal, Haryana, 121102', true, 28.14, 77.33],
      ['Dhingra Trucking - Bahadurgarh', 'Beside Swami Filling Station, opposite Jhajjar Police, Jhajjar - Bahadurgarh Rd, Jhajjar, Haryana 124103', true, 28.69, 76.93],
      ['Dhingra Trucking - Charkhi Dadari', 'Plot No.1 Loharu Road, Charkhi Dadri, Bhiwani 127306', true, 28.59, 76.27],
      ['Dhingra Trucking - Dharuhera', 'Plot No. 22, Dharuhera Industrial Area, Dist. Rewari, Haryana 123106', true, 28.21, 76.80],
      ['Dhingra Trucking - Gurgaon', 'Khasra Killa No 2482/320/2/2, Opposite Shikopur Turning, Village Rampura NH-8, Jaipur Highway, Gurgaon, Haryana, 122002', true, 28.46, 77.03],
      ['Dhingra Trucking - Hisar', 'Plot No.175, Sector 27 & 28, Hisar, Haryana 125001', false, 29.15, 75.72],
      ['Dhingra Trucking - Karnal', 'Khasra No 74/16/1/17, 18, 23 & 24, Village Bastra, Ambala Delhi NH-1, Dist - Karnal, Haryana 132114', true, 29.69, 76.99],
      ['Dhingra Trucking - Kashmiri Gate', 'Shop no 1522, Ground floor, Kashmere Gate, New Delhi, 110006', true, 28.67, 77.23],
      ['Dhingra Trucking - Narayangarh', 'Khasara No 48/15/2, Village Shehzadpur, Go Shala near Flyover, Tehsil Narayangarh, Ambala, Haryana, 134202', false, 30.48, 77.13],
      ['Dhingra Trucking - Safidon', 'Khewat No 124, Khasra No 133, Panipat Road, Anaj Mandi, Safidon, Jind, Haryana 126112', true, 29.41, 76.67],
      ['Dhingra Trucking - SGTN/ Alipur', 'Khasra No: 292 293, Village Siraspur, Alipur, Outer Delhi, 110043', true, 28.80, 77.13],
      ['Dhingra Trucking - Sonipat', 'Plot Khewat No. 194, Khata No. 228, Bahalgarh Road, Sonipat, Haryana, 131021', true, 28.99, 77.02],
      ['Dhingra Trucking - Yamuna Nagar', 'Khewat No 18 Khasara No 10/23, Teh Jagadhri, Bham Bholi, Yamunanagar, Haryana, 133103', false, 30.13, 77.29]
    ].map(([name, address, eligible, lat, lon]) => ({ name, address, eligible, lat, lon }));
    const q = s.q.trim().toLowerCase();
    const shown = DIR.filter((d) => (!s.pv || d.eligible) && (!q || (d.name + ' ' + d.address).toLowerCase().includes(q)));
    const dirDealers = shown.map((d, i) => ({
      ...d,
      rowStyle: `padding: 40px 56px 44px; background: ${i % 2 === 0 ? '#F5F5F5' : '#FFFFFF'}; border-bottom: 2px solid #E5E5E5`
    }));
    const pins = shown.map((d) => {
      const x = ((d.lon - 75.3) / (80.0 - 75.3)) * 100;
      const y = ((30.9 - d.lat) / (30.9 - 26.8)) * 100;
      return { name: d.name, style: `position: absolute; left: ${x.toFixed(2)}%; top: ${y.toFixed(2)}%; transform: translate(-50%, -100%); line-height: 0; z-index: 1` };
    });
    const chip = (on) => `display: inline-flex; align-items: center; gap: 8px; border: 0; padding: 0 20px; min-height: 54px; font-size: 18px; font-weight: 700; cursor: pointer; color: #FFFFFF; background: ${on ? accent : '#303030'}`;
    const svcs = ['Sales', 'Services', 'Spare Parts', 'Used Vehicles'].map((label) => ({
      label, on: !!s.svc[label], style: chip(!!s.svc[label]),
      toggle: () => this.setState({ svc: { ...s.svc, [label]: !s.svc[label] } })
    }));
    const pill = (on) => `min-height: 28px; padding: 2px 12px; border: 0; cursor: pointer; font-size: 13px; font-weight: 600; background: ${on ? '#FFFFFF' : 'transparent'}; color: ${on ? '#111111' : '#C9CCCF'}`;
    return {
      accent,
      isEn: s.lang === 'en', isHi: s.lang === 'hi',
      enStyle: pill(s.lang === 'en'), hiStyle: pill(s.lang === 'hi'),
      setEn: () => this.setState({ lang: 'en' }), setHi: () => this.setState({ lang: 'hi' }),
      navItems, closeMenu: () => this.setState({ menu: null }),
      pv: s.pv, pvStyle: chip(s.pv), togglePv: () => this.setState({ pv: !s.pv }),
      svcs, dirDealers, pins, dNone: shown.length === 0,
      qInput: s.qInput,
      onQ: (e) => this.setState({ qInput: e.target.value }),
      onFind: (e) => { e.preventDefault(); this.setState({ q: s.qInput }); }
    };
  }
}
mountDC(Component, {"accent": "#99231E", "startEligible": true});
